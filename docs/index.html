
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads 開戶客戶雷達</title>
<style>
body{font-family:-apple-system,sans-serif;background:#f4f6f8;color:#222;margin:0;padding:16px}
header{max-width:850px;margin:auto}
h1{font-size:24px}
input,select{padding:12px;border:1px solid #ccc;border-radius:9px;font-size:15px}
input{width:90%;margin:10px 0}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat,.post{background:white;padding:15px;border-radius:12px;margin:12px 0}
.stat{flex:1;min-width:90px}
.stat b{font-size:24px;display:block}
.post{line-height:1.6;border:1px solid #eee}
a{color:#1769aa}
small{color:#777}
.tag{background:#e7efff;padding:4px 9px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>🔎 Threads 開戶客戶雷達</h1>
<p>自動整理公開貼文，尋找潛在開戶客戶</p>
<div class="stats">
<div class="stat"><b id="count">0</b>客戶貼文</div>
<div class="stat"><b id="kwcount">0</b>搜尋關鍵字</div>
<div class="stat"><b id="errors">0</b>搜尋錯誤</div>
</div>
<p id="updated">資料讀取中...</p>
<input id="search" placeholder="搜尋帳號、貼文、關鍵字" oninput="render()">
<div id="results"></div>
</header>
<script>
let posts=[];
function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
async function load(){
 try{
  const r=await fetch("./posts.json?t="+Date.now());
  if(!r.ok) throw Error("尚未產生搜尋資料");
  const d=await r.json();
  posts=d.posts||[];
  document.getElementById("count").textContent=posts.length;
  document.getElementById("kwcount").textContent=(d.keywords||[]).length;
  document.getElementById("errors").textContent=(d.errors||[]).length;
  document.getElementById("updated").textContent=
   "最後更新："+(d.updated_at||"尚無資料");
  render();
 }catch(e){
  document.getElementById("updated").textContent=
   "目前尚無搜尋資料："+e.message;
 }
}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const rows=posts.filter(p=>
  [p.text,p.username,p.keyword,(p.matched_keywords||[]).join(" ")]
  .join(" ").toLowerCase().includes(q)
 );
 document.getElementById("results").innerHTML=rows.length?
 rows.map(p=>`
 <div class="post">
 <b>@${esc(p.username||"未知帳號")}</b>
 <p>${esc(p.text)}</p>
 <span class="tag">${esc(p.keyword||"關鍵字")}</span>
 <p><small>發現時間：${esc(p.discovered_at||"")}</small></p>
 <a href="${esc(p.url)}" target="_blank" rel="noopener">查看 Threads 原文 ↗</a>
 </div>`).join(""):"<p>目前沒有符合的貼文</p>";
}
load();
setInterval(load,60000);
</script>
</body>
</html>
